description:
  it-IT:
    localisedName: TagliandOnline
    shortDescription: Tagliandi, permessi, domande, direttamente da web.
    longDescription: >-
      Genera tagliandi in DOCX e PDF da comodi modelli personalizzabili.

      Trasmetti tagliandi e autorizzazioni firmate via email in modo automatico.

      Effettua ispezioni sul posto per rilevare anomalie e discrepanze sui
      tagliandi esposti sui veicoli. 

      Gestisci le domande presentate.
    documentation: https://github.com/castagnetocarducci/tagliandonline/blob/main/README.md
    features:
      - Configurazione di più tipologie di permesso
      - Modelli completamente personalizzabili basati su variabili
      - Generazione automatica dei PDF dei tagliandi
      - Modelli di email personalizzabili per ogni tipologia di permesso
      - Generazione e invio di email direttamente da programma
      - Storicizzazione dettagliata delle modifiche
      - Numerazione automatica dei tagliandi personalizzabile
      - Ispezioni sul campo per rilevare discrepanze, anche per il numero di
        veicoli che espone lo stesso tagliando
      - PWA per smartphone
      - Basato su Design React Kit
      - Immagine Docker con variabili d'ambiente
      - Multiutente con diversi ruoli
      - Recupero password tramite email
    screenshots:
      - media/generated_voucher_example.png
